<style>
  :root{
    --accent:#B5591C;
    --accent-dark:#8F3B22;
    --green:#2F6A44;
    --cream:#FBF1DF;
    --cream-card:#FFF9EF;
    --ink:#2B1A10;
    --display:'Bricolage Grotesque',sans-serif;
    --body:'Hanken Grotesk',system-ui,sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;
    display:flex;align-items:center;justify-content:center;padding:28px;
    font-family:var(--body);color:var(--ink);background:var(--cream);
  }
  .card{
    max-width:460px;width:100%;text-align:center;
    background:var(--cream-card);border-radius:24px;padding:44px 36px;
    box-shadow:0 20px 50px rgba(90,55,20,0.14);
  }
  .logo-img{height:34px;width:auto;margin:0 auto 28px;display:block;}
  .check{
    width:64px;height:64px;border-radius:50%;margin:0 auto 22px;
    background:var(--green);color:#FFF9EF;font-size:32px;
    display:flex;align-items:center;justify-content:center;
  }
  h1{font-family:var(--display);font-weight:700;font-size:26px;margin:0 0 14px;letter-spacing:-0.01em;}
  p{font-size:15.5px;line-height:1.6;color:#5C4630;margin:0 0 28px;}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;
    background:var(--accent);color:#FFF9EF;font-family:var(--body);font-weight:700;
    font-size:15px;padding:13px 28px;border-radius:999px;text-decoration:none;
    box-shadow:0 6px 18px rgba(160,70,20,0.28);transition:transform .18s ease;
  }
  .btn:hover{transform:translateY(-2px);}
</style>
</head>
<body>
<!-- Google Tag Manager (noscript) -->

  <div class="card">
    <img class="logo-img" src="assets/blackLogo.png" alt="L'Aventure du Sucre">
    <div class="check" aria-hidden="true">&#10003;</div>
    <h1>Merci !</h1>
    <p>Votre application e-mail devrait maintenant être ouverte avec votre message prêt à envoyer — il ne reste plus qu'à cliquer sur envoyer pour que notre équipe reçoive votre demande. Nous vous recontacterons très prochainement pour confirmer votre visite.</p>
    <a class="btn" href="/fr">Retour à l'accueil</a>
  </div>
</body>
