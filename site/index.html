<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>L'Aventure du Sucre — The sweetest adventure in Mauritius</title>
<meta name="description" content="Step inside a 260-year-old sugar factory in Beau Plan, Mauritius. Taste rare rums, discover extraordinary sugars, and follow the story of sugar — a half-day out the whole family will remember.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --accent:#B5591C;
    --accent-dark:#8F3B22;
    --green:#2F6A44;
    --cream:#FBF1DF;
    --cream-card:#FFF9EF;
    --ink:#2B1A10;
    --dark:#23140C;
    --dark-text:#F6E7CE;
    --amber:#F0A94B;
    --display:'Bricolage Grotesque',sans-serif;
    --body:'Hanken Grotesk',system-ui,sans-serif;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    font-family:var(--body);
    color:var(--ink);
    background:var(--cream);
    overflow-x:hidden;
  }
  a{color:var(--accent);text-decoration:none;}
  a:hover{color:var(--accent-dark);}
  img{display:block;max-width:100%;}
  h1,h2,h3,h4{font-family:var(--display);}

  @keyframes riseIn{from{opacity:0;transform:translateY(26px);}to{opacity:1;transform:none;}}

  section{scroll-margin-top:88px;}

  .wrap{max-width:1200px;margin:0 auto;padding:0 28px;}

  /* ── Header ─────────────────────────────────────────── */
  .site-header{
    position:sticky;top:0;z-index:60;
    background:rgba(251,241,223,0.88);
    backdrop-filter:blur(12px);
    border-bottom:1px solid #EAD8B8;
  }
  .nav{
    max-width:1200px;margin:0 auto;padding:13px 28px;
    display:flex;align-items:center;gap:22px;
  }
  .brand{display:flex;align-items:center;gap:12px;color:var(--ink);}
  .brand:hover{color:var(--ink);}
  .brand-mark{
    width:42px;height:42px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:var(--accent);color:#FFF9EF;
    font-family:var(--display);font-weight:800;font-size:21px;
    box-shadow:0 4px 14px rgba(160,70,20,0.28);
    flex:none;
  }
  .brand-name{display:flex;flex-direction:column;line-height:1.15;}
  .brand-name strong{font-family:var(--display);font-weight:700;font-size:14.5px;letter-spacing:0.06em;}
  .brand-name span{font-size:11px;letter-spacing:0.04em;color:#8A6A4C;}
  .nav-spacer{flex:1;}
  .nav-links{display:flex;gap:26px;align-items:center;font-weight:500;font-size:15px;}
  .nav-links a{color:#4A3320;}
  .nav-links a:hover{color:var(--accent);}

  .btn{
    cursor:pointer;font-family:var(--body);border:none;
    border-radius:999px;display:inline-flex;align-items:center;justify-content:center;
  }
  .btn-lang{
    background:transparent;border:1px solid #D8C29B;color:#4A3320;
    padding:8px 14px;font-size:13px;font-weight:600;letter-spacing:0.02em;gap:6px;
    transition:border-color .18s ease,color .18s ease;
  }
  .btn-lang:hover{border-color:var(--accent);color:var(--accent);}
  .btn-primary{
    background:var(--accent);color:#FFF9EF;
    padding:11px 20px;font-size:14.5px;font-weight:700;
    box-shadow:0 6px 18px rgba(160,70,20,0.28);
    transition:transform .18s ease,box-shadow .18s ease;
  }
  .btn-primary:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(160,70,20,0.34);}

  /* ── Hero ───────────────────────────────────────────── */
  .hero{
    position:relative;min-height:88vh;min-height:640px;
    display:flex;align-items:flex-end;overflow:hidden;background:#3A2517;
  }
  .hero-bg{position:absolute;inset:0;}
  .hero-bg img{width:100%;height:100%;object-fit:cover;}
  .hero-scrim{
    position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(175deg,rgba(35,20,12,0.28) 0%,rgba(35,20,12,0.05) 38%,rgba(35,20,12,0.55) 74%,rgba(35,20,12,0.82) 100%);
  }
  .hero-inner{position:relative;width:100%;max-width:1200px;margin:0 auto;padding:120px 28px 68px;}
  .hero-content{max-width:660px;color:#FFF9EF;}
  .eyebrow-pill{
    display:inline-flex;align-items:center;gap:8px;
    background:rgba(255,249,239,0.14);border:1px solid rgba(255,249,239,0.32);
    backdrop-filter:blur(4px);padding:7px 15px;border-radius:999px;
    font-size:13px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;
    animation:riseIn .6s both;
  }
  .eyebrow-dot{width:7px;height:7px;border-radius:50%;background:var(--amber);flex:none;}
  .hero h1{
    font-weight:700;font-size:clamp(42px,7vw,86px);line-height:0.98;letter-spacing:-0.02em;
    margin:22px 0 0;text-wrap:balance;text-shadow:0 2px 30px rgba(20,10,4,0.4);
    animation:riseIn .7s both;animation-delay:.08s;
  }
  .hero-lead{
    font-size:clamp(16px,1.7vw,19px);line-height:1.6;max-width:560px;margin:22px 0 0;color:#F4E7D3;
    animation:riseIn .7s both;animation-delay:.16s;
  }
  .hero-actions{display:flex;flex-wrap:wrap;gap:14px;margin-top:30px;animation:riseIn .7s both;animation-delay:.24s;}
  .btn-hero{
    background:var(--accent);color:#FFF9EF;padding:16px 30px;font-size:17px;font-weight:700;
    box-shadow:0 10px 30px rgba(120,50,12,0.45);transition:transform .18s ease,box-shadow .18s ease;
  }
  .btn-hero:hover{transform:translateY(-2px);box-shadow:0 14px 36px rgba(120,50,12,0.55);}
  .btn-ghost{
    display:inline-flex;align-items:center;gap:9px;
    background:rgba(255,249,239,0.12);border:1px solid rgba(255,249,239,0.4);color:#FFF9EF;
    padding:16px 26px;border-radius:999px;font-size:16px;font-weight:600;
    backdrop-filter:blur(4px);transition:background .18s ease;
  }
  .btn-ghost:hover{background:rgba(255,249,239,0.22);color:#FFF9EF;}
  .hero-chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px;animation:riseIn .7s both;animation-delay:.32s;}
  .chip{
    display:inline-flex;align-items:center;gap:7px;font-size:13.5px;font-weight:500;color:#F4E7D3;
    background:rgba(255,249,239,0.1);padding:7px 14px;border-radius:999px;
  }

  /* ── Stats band ─────────────────────────────────────── */
  .stats{background:var(--dark);color:var(--dark-text);}
  .stats-grid{
    max-width:1200px;margin:0 auto;padding:40px 28px;
    display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:22px;
  }
  .stat{display:flex;flex-direction:column;gap:6px;padding:8px 0 8px 18px;border-left:2px solid rgba(240,169,75,0.4);}
  .stat-num{font-family:var(--display);font-weight:700;font-size:clamp(30px,3.6vw,44px);line-height:1;color:var(--amber);}
  .stat-label{font-size:14px;color:#D8C09E;line-height:1.35;}

  /* ── Section headings ───────────────────────────────── */
  .section-pad{padding:clamp(64px,9vw,104px) 0;}
  .head{max-width:680px;}
  .eyebrow{font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:0.14em;text-transform:uppercase;color:var(--accent);}
  .head h2{font-weight:700;font-size:clamp(30px,4.4vw,54px);line-height:1.02;letter-spacing:-0.02em;margin:14px 0 0;text-wrap:balance;}
  .head p{font-size:18px;line-height:1.62;color:#5C4630;margin:18px 0 0;}

  /* ── Experience ─────────────────────────────────────── */
  .experience{background:var(--cream);}
  .feature-img{
    margin-top:40px;border-radius:24px;overflow:hidden;
    height:clamp(260px,34vw,420px);background:#E7D5B4;box-shadow:0 20px 50px rgba(90,55,20,0.16);
  }
  .feature-img img{width:100%;height:100%;object-fit:cover;}
  .cards{margin-top:36px;display:grid;grid-template-columns:repeat(auto-fit,minmax(238px,1fr));gap:22px;}
  .card{
    background:var(--cream-card);border:1px solid #EBD9BB;border-radius:20px;padding:30px 26px;
    display:flex;flex-direction:column;gap:12px;transition:transform .2s ease,box-shadow .2s ease;
  }
  .card:hover{transform:translateY(-5px);box-shadow:0 16px 34px rgba(120,70,20,0.14);}
  .card-n{font-family:var(--display);font-weight:700;font-size:15px;color:var(--accent);letter-spacing:0.08em;}
  .card h3{font-weight:700;font-size:22px;line-height:1.12;margin:0;}
  .card p{font-size:15px;line-height:1.6;color:#6B543C;margin:0;}

  /* ── Tasting (dark) ─────────────────────────────────── */
  .tasting{background:var(--dark);color:var(--dark-text);position:relative;overflow:hidden;}
  .tasting-glow{
    position:absolute;top:-80px;right:-60px;width:300px;height:300px;border-radius:50%;
    background:radial-gradient(circle,rgba(240,169,75,0.16),transparent 70%);pointer-events:none;
  }
  .tasting .wrap{position:relative;}
  .tasting .eyebrow{color:var(--amber);}
  .tasting .head h2{color:#FFF9EF;}
  .tasting .head p{color:#D8C09E;}
  .split{margin-top:44px;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:38px;align-items:center;}
  .split-img{border-radius:22px;overflow:hidden;height:clamp(260px,26vw,360px);background:#3A2517;}
  .split-img img{width:100%;height:100%;object-fit:cover;}
  .split h3{font-weight:700;font-size:clamp(24px,2.6vw,32px);line-height:1.08;margin:0;color:#FFF9EF;}
  .split p{font-size:16.5px;line-height:1.65;color:#D8C09E;margin:16px 0 0;}
  .split .media-right{order:2;}
  .split .text-left{order:1;}
  .venues{margin-top:44px;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;}
  .venue{background:rgba(255,249,239,0.06);border:1px solid rgba(255,249,239,0.12);border-radius:18px;padding:26px;}
  .venue h4{font-weight:700;font-size:19px;margin:0;color:var(--amber);}
  .venue p{font-size:15px;line-height:1.55;color:#D8C09E;margin:10px 0 0;}

  /* ── Visit ──────────────────────────────────────────── */
  .visit{background:var(--cream-card);}
  .visit-grid{margin-top:40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:26px;align-items:stretch;}
  .info-col{display:flex;flex-direction:column;gap:18px;}
  .info-card{background:var(--cream);border:1px solid #EBD9BB;border-radius:18px;padding:24px 26px;}
  .info-label{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:0.1em;text-transform:uppercase;color:var(--green);}
  .info-strong{font-size:19px;font-weight:600;margin-top:8px;}
  .info-time{font-size:22px;font-weight:700;font-family:var(--display);color:var(--ink);margin-top:2px;}
  .info-note{font-size:14px;color:#8A6A4C;margin-top:6px;line-height:1.5;}
  .price-list{display:flex;flex-direction:column;gap:5px;margin-top:10px;font-size:16px;}
  .price-list .muted{font-size:14px;color:#8A6A4C;}
  .map-img{border-radius:20px;overflow:hidden;min-height:360px;background:#E7D5B4;border:1px solid #EBD9BB;}
  .map-img img{width:100%;height:100%;object-fit:cover;}
  .visit-cta{margin-top:30px;text-align:center;}
  .btn-book-lg{
    background:var(--accent);color:#FFF9EF;padding:16px 34px;font-size:17px;font-weight:700;
    box-shadow:0 10px 28px rgba(160,70,20,0.28);transition:transform .18s ease;
  }
  .btn-book-lg:hover{transform:translateY(-2px);}

  /* ── CTA band ───────────────────────────────────────── */
  .cta{background:var(--accent);color:#FFF9EF;padding:clamp(56px,8vw,90px) 0;text-align:center;}
  .cta-inner{max-width:760px;margin:0 auto;padding:0 28px;}
  .cta h2{font-weight:700;font-size:clamp(30px,4.6vw,52px);line-height:1.02;letter-spacing:-0.02em;margin:0;text-wrap:balance;}
  .cta p{font-size:18px;line-height:1.55;color:#FCEBD6;margin:16px 0 30px;}
  .btn-cta{
    background:#FFF9EF;color:var(--accent-dark);padding:17px 38px;font-size:18px;font-weight:700;
    box-shadow:0 12px 30px rgba(60,25,8,0.28);transition:transform .18s ease,box-shadow .18s ease;
  }
  .btn-cta:hover{transform:translateY(-3px);box-shadow:0 16px 38px rgba(60,25,8,0.36);}

  /* ── Footer ─────────────────────────────────────────── */
  .site-footer{background:var(--dark);color:#C9B79A;padding:52px 0 44px;}
  .footer-top{
    max-width:1200px;margin:0 auto;padding:0 28px;
    display:flex;flex-wrap:wrap;gap:28px;justify-content:space-between;align-items:flex-start;
  }
  .footer-brand{max-width:340px;}
  .footer-brand-row{display:flex;align-items:center;gap:12px;}
  .footer-mark{
    width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:var(--accent);color:#FFF9EF;font-family:var(--display);font-weight:800;font-size:19px;flex:none;
  }
  .footer-brand-row strong{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:0.06em;color:#FFF9EF;}
  .footer-tagline{font-size:14.5px;line-height:1.55;margin:16px 0 0;}
  .footer-contact{display:flex;gap:48px;flex-wrap:wrap;}
  .footer-contact-col{display:flex;flex-direction:column;gap:9px;font-size:14.5px;}
  .footer-address{color:var(--amber);font-weight:600;}
  .footer-rights{
    max-width:1200px;margin:32px auto 0;padding:20px 28px 0;
    border-top:1px solid rgba(255,249,239,0.1);font-size:13px;color:#8A7358;
  }

  @media (max-width:760px){
    .nav-links{display:none;}
  }
</style>
</head>
<body>

  <header class="site-header">
    <nav class="nav">
      <a href="#top" class="brand">
        <span class="brand-mark">S</span>
        <span class="brand-name">
          <strong>L'AVENTURE DU SUCRE</strong>
          <span data-i18n="brandTag"></span>
        </span>
      </a>
      <div class="nav-spacer"></div>
      <div class="nav-links">
        <a href="#experience" data-i18n="navExp"></a>
        <a href="#tasting" data-i18n="navTaste"></a>
        <a href="#visit" data-i18n="navVisit"></a>
      </div>
      <button class="btn btn-lang" data-action="toggle-lang" aria-label="Switch language">
        <span aria-hidden="true">◍</span><span data-i18n="langToggle"></span>
      </button>
      <button class="btn btn-primary" data-action="book" data-i18n="navBook"></button>
    </nav>
  </header>

  <section id="top" class="hero">
    <div class="hero-bg">
      <img src="./assets/hero.jpg" alt="The historic sugar factory at L'Aventure du Sucre, Beau Plan">
    </div>
    <div class="hero-scrim"></div>
    <div class="hero-inner">
      <div class="hero-content">
        <div class="eyebrow-pill">
          <span class="eyebrow-dot"></span><span data-i18n="heroEyebrow"></span>
        </div>
        <h1 data-i18n="heroTitle"></h1>
        <p class="hero-lead" data-i18n="heroText"></p>
        <div class="hero-actions">
          <button class="btn btn-hero" data-action="book" data-i18n="heroBook"></button>
          <a href="#experience" class="btn-ghost"><span data-i18n="heroPlan"></span> <span aria-hidden="true">↓</span></a>
        </div>
        <div class="hero-chips">
          <span class="chip">🕘 <span data-i18n="chip1"></span></span>
          <span class="chip">⏱ <span data-i18n="chip2"></span></span>
          <span class="chip">👶 <span data-i18n="chip3"></span></span>
        </div>
      </div>
    </div>
  </section>

  <section class="stats">
    <div class="stats-grid" id="stats-grid"></div>
  </section>

  <section id="experience" class="experience section-pad">
    <div class="wrap">
      <div class="head">
        <span class="eyebrow" data-i18n="expEyebrow"></span>
        <h2 data-i18n="expTitle"></h2>
        <p data-i18n="expText"></p>
      </div>
      <div class="feature-img">
        <img src="./assets/expFeature.webp" alt="Inside the museum: historic sugar-factory machinery">
      </div>
      <div class="cards" id="cards-grid"></div>
    </div>
  </section>

  <section id="tasting" class="tasting section-pad">
    <div class="tasting-glow"></div>
    <div class="wrap">
      <div class="head">
        <span class="eyebrow" data-i18n="tasteEyebrow"></span>
        <h2 data-i18n="tasteTitle"></h2>
        <p data-i18n="tasteText"></p>
      </div>

      <div class="split">
        <div class="split-img">
          <img src="./assets/rum.webp" alt="The rum tasting bar">
        </div>
        <div>
          <h3 data-i18n="rumTitle"></h3>
          <p data-i18n="rumText"></p>
        </div>
      </div>

      <div class="split">
        <div class="split-img media-right">
          <img src="./assets/sugar.webp" alt="A range of unrefined Mauritian sugars">
        </div>
        <div class="text-left">
          <h3 data-i18n="sugarTitle"></h3>
          <p data-i18n="sugarText"></p>
        </div>
      </div>

      <div class="venues">
        <div class="venue">
          <h4 data-i18n="fangourinTitle"></h4>
          <p data-i18n="fangourinText"></p>
        </div>
        <div class="venue">
          <h4 data-i18n="boutiqueTitle"></h4>
          <p data-i18n="boutiqueText"></p>
        </div>
      </div>
    </div>
  </section>

  <section id="visit" class="visit section-pad">
    <div class="wrap">
      <div class="head">
        <span class="eyebrow" data-i18n="visitEyebrow"></span>
        <h2 data-i18n="visitTitle"></h2>
        <p data-i18n="visitText"></p>
      </div>
      <div class="visit-grid">
        <div class="info-col">
          <div class="info-card">
            <div class="info-label" data-i18n="hoursLabel"></div>
            <div class="info-strong" data-i18n="hoursValue"></div>
            <div class="info-time" data-i18n="hoursTime"></div>
            <div class="info-note" data-i18n="hoursNote"></div>
          </div>
          <div class="info-card">
            <div class="info-label" data-i18n="priceLabel"></div>
            <div class="price-list">
              <span data-i18n="priceAdult"></span>
              <span data-i18n="priceChild"></span>
              <span data-i18n="priceFree"></span>
              <span class="muted" data-i18n="priceFamily"></span>
            </div>
          </div>
          <div class="info-card">
            <div class="info-label" data-i18n="locLabel"></div>
            <div class="info-strong" data-i18n="locValue"></div>
            <div class="info-note" data-i18n="locNote"></div>
          </div>
        </div>
        <div class="map-img">
          <img src="./assets/map.webp" alt="Map of L'Aventure du Sucre in Beau Plan, Pamplemousses">
        </div>
      </div>
      <div class="visit-cta">
        <button class="btn btn-book-lg" data-action="book" data-i18n="visitBook"></button>
      </div>
    </div>
  </section>

  <section class="cta">
    <div class="cta-inner">
      <h2 data-i18n="ctaTitle"></h2>
      <p data-i18n="ctaText"></p>
      <button class="btn btn-cta" data-action="book" data-i18n="ctaBook"></button>
    </div>
  </section>

  <footer class="site-footer">
    <div class="footer-top">
      <div class="footer-brand">
        <div class="footer-brand-row">
          <span class="footer-mark">S</span>
          <strong>L'AVENTURE DU SUCRE</strong>
        </div>
        <p class="footer-tagline" data-i18n="footerTagline"></p>
      </div>
      <div class="footer-contact">
        <div class="footer-contact-col">
          <span class="footer-address" data-i18n="footerAddress"></span>
          <span id="footer-hours"></span>
        </div>
      </div>
    </div>
    <div class="footer-rights" data-i18n="footerRights"></div>
  </footer>

<script>
  const STRINGS = {
    en: {
      brandTag: "Sugar Museum · Mauritius",
      navExp: "The Experience", navTaste: "Tastings", navVisit: "Visit", navBook: "Book tickets",
      langToggle: "Français",
      heroEyebrow: "Beau Plan · Northern Mauritius",
      heroTitle: "The sweetest adventure on the island",
      heroText: "Step inside a 260-year-old sugar factory. Taste rare rums, discover sugars you never knew existed, and follow the story that shaped Mauritius — a half-day out the whole family will remember.",
      heroBook: "Book your tickets", heroPlan: "Plan your visit",
      chip1: "Open 7 days · 9am–5pm", chip2: "Around 1.5 hrs", chip3: "Under 6s go free",
      stats: [
        { num: "260", label: "years of sugar history" },
        { num: "5,000 m²", label: "of factory to explore" },
        { num: "11", label: "local rums to taste" },
        { num: "20+", label: "special sugars to try" },
      ],
      expEyebrow: "The Experience",
      expTitle: "What's waiting inside",
      expText: "One ticket, a dozen discoveries. Wander a real 1797 factory at your own pace — with plenty to keep curious kids busy along the way.",
      cards: [

  const STORAGE_KEY = "lads-lang";
  const SUPPORTED = ["en", "fr"];

  function initialLang() {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (SUPPORTED.includes(saved)) return saved;
    const nav = (navigator.language || "en").slice(0, 2).toLowerCase();
    return nav === "fr" ? "fr" : "en";
  }

  let lang = initialLang();

  function render() {
    const t = STRINGS[lang];
    document.documentElement.lang = lang;

    document.querySelectorAll("[data-i18n]").forEach((el) => {
      const key = el.getAttribute("data-i18n");
      if (t[key] != null) el.textContent = t[key];
    });

    // Stats band
    const statsGrid = document.getElementById("stats-grid");
    statsGrid.innerHTML = "";
    t.stats.forEach((s) => {
      const wrap = document.createElement("div");
      wrap.className = "stat";
      const num = document.createElement("span");
      num.className = "stat-num";
      num.textContent = s.num;
      const label = document.createElement("span");
      label.className = "stat-label";
      label.textContent = s.label;
      wrap.append(num, label);
      statsGrid.appendChild(wrap);
    });

    // Experience cards
    const cardsGrid = document.getElementById("cards-grid");
    cardsGrid.innerHTML = "";
    t.cards.forEach((c) => {
      const card = document.createElement("div");
      card.className = "card";
      const n = document.createElement("span");
      n.className = "card-n";
      n.textContent = c.n;
      const h3 = document.createElement("h3");
      h3.textContent = c.title;
      const p = document.createElement("p");
      p.textContent = c.body;
      card.append(n, h3, p);
      cardsGrid.appendChild(card);
    });

    // Footer hours line
    document.getElementById("footer-hours").textContent = t.hoursValue + " · " + t.hoursTime;
  }

  function scrollToVisit() {
    const el = document.getElementById("visit");
    if (el) {
      const y = el.getBoundingClientRect().top + window.scrollY - 76;
      window.scrollTo({ top: y, behavior: "smooth" });
    }
  }

  function toggleLang() {
    lang = lang === "en" ? "fr" : "en";
    localStorage.setItem(STORAGE_KEY, lang);
    render();
  }

  document.addEventListener("click", (e) => {
    const target = e.target.closest("[data-action]");
    if (!target) return;
    const action = target.getAttribute("data-action");
    if (action === "toggle-lang") toggleLang();
    if (action === "book") { e.preventDefault(); scrollToVisit(); }
  });

  render();
</script>
