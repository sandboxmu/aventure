# Netlify configuration for the L'Aventure du Sucre landing page.
# Static site — nothing to build; the repository root is published as-is.

[build]
  publish = "."
  # No build step: the site is plain HTML/CSS/JS.
  command = ""

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Booking form → Brevo. Must come before the catch-all below, otherwise the
# SPA rewrite would answer the POST with index.html.
#
# The function deliberately does NOT declare its own `config.path`: doing so
# removes its default /.netlify/functions/ URL, which this rule rewrites to,
# and the two together produce a 404.
[[redirects]]
  from = "/api/booking"
  to = "/.netlify/functions/booking"
  status = 200
  force = true

# Single-page site: serve index.html for any path that isn't a real file.
# Netlify checks for an existing file first, so real assets (/assets/*) are
# served directly; only unknown paths fall through to the landing page.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Long-cache the fingerprint-free image assets (safe to bump if you swap them).
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
