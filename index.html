<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>L'Aventure du Sucre — The sweetest adventure in Mauritius</title>
<meta name="description" content="Step inside a 260-year-old sugar factory in Beau Plan, Mauritius. Taste rare rums, discover extraordinary sugars, and follow the story of sugar — a half-day out the whole family will remember.">
<link rel="canonical" href="/">
<link rel="alternate" hreflang="en" href="/">
<link rel="alternate" hreflang="fr" href="/fr">
<link rel="alternate" hreflang="x-default" href="/">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --accent:#B5591C;
    --accent-dark:#8F3B22;
    --green:#2F6A44;
    --cream:#FBF1DF;
    --cream-card:#FFF9EF;
    --ink:#2B1A10;
    --dark:#23140C;
    --dark-text:#F6E7CE;
    --amber:#F0A94B;
    --brand-blue:#17479B;
    --display:'Bricolage Grotesque',sans-serif;
    --body:'Hanken Grotesk',system-ui,sans-serif;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    font-family:var(--body);
    color:var(--ink);
    background:var(--cream);
    overflow-x:hidden;
  }
  a{color:var(--accent);text-decoration:none;}
  a:hover{color:var(--accent-dark);}
  img{display:block;max-width:100%;}
  h1,h2,h3,h4{font-family:var(--display);}

  @keyframes riseIn{from{opacity:0;transform:translateY(26px);}to{opacity:1;transform:none;}}

  section{scroll-margin-top:88px;}

  .wrap{max-width:1200px;margin:0 auto;padding:0 28px;}

  /* ── Header ─────────────────────────────────────────── */
  .site-header{
    position:sticky;top:0;z-index:60;
    background:rgba(251,241,223,0.88);
    backdrop-filter:blur(12px);
    border-bottom:1px solid #EAD8B8;
  }
  .nav{
    max-width:1200px;margin:0 auto;padding:13px 28px;
    display:flex;align-items:center;gap:22px;
  }
  .brand{display:flex;align-items:center;gap:12px;color:var(--ink);}
  .brand:hover{color:var(--ink);}
  .brand-mark{
    width:42px;height:42px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:var(--accent);color:#FFF9EF;
    font-family:var(--display);font-weight:800;font-size:21px;
    box-shadow:0 4px 14px rgba(160,70,20,0.28);
    flex:none;
  }
  .brand-name{display:flex;flex-direction:column;line-height:1.15;}
  .brand-name strong{font-family:var(--display);font-weight:700;font-size:14.5px;letter-spacing:0.06em;}
  .brand-name span{font-size:11px;letter-spacing:0.04em;color:#8A6A4C;}
  .nav-spacer{flex:1;}
  .nav-links{display:flex;gap:26px;align-items:center;font-weight:500;font-size:15px;}
  .nav-links a{color:#4A3320;}
  .nav-links a:hover{color:var(--accent);}

  /* Brand wordmark (recreated in CSS; theme-able via color) */
  .brand-logo{display:inline-flex;flex-direction:column;line-height:0.78;color:var(--brand-blue);}
  .brand-logo .wl-1{font-family:var(--display);font-weight:600;font-size:12.5px;letter-spacing:0.005em;}
  .brand-logo .wl-2{font-family:var(--display);font-weight:800;font-size:29px;letter-spacing:-0.01em;}
  .brand-tag{padding-left:14px;border-left:1px solid #D8C29B;font-size:11px;letter-spacing:0.04em;color:#8A6A4C;max-width:118px;line-height:1.25;}
  .footer-logo{display:inline-flex;flex-direction:column;line-height:0.78;color:#FFF9EF;}
  .footer-logo .wl-1{font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:0.005em;}
  .footer-logo .wl-2{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-0.01em;}

  /* Hamburger (mobile) */
  .nav-toggle{
    display:none;width:40px;height:40px;flex:none;border:none;background:transparent;cursor:pointer;
    flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:0;
  }
  .nav-toggle span{display:block;width:22px;height:2px;background:#3A2517;border-radius:2px;transition:transform .2s ease,opacity .2s ease;}
  .site-header.menu-open .nav-toggle span:nth-child(1){transform:translateY(7px) rotate(45deg);}
  .site-header.menu-open .nav-toggle span:nth-child(2){opacity:0;}
  .site-header.menu-open .nav-toggle span:nth-child(3){transform:translateY(-7px) rotate(-45deg);}

  /* Mobile dropdown menu */
  .mobile-menu{display:none;flex-direction:column;padding:6px 22px 18px;background:rgba(251,241,223,0.98);border-top:1px solid #EAD8B8;}
  .mobile-menu a{padding:14px 2px;font-size:16px;font-weight:600;color:#4A3320;border-bottom:1px solid rgba(234,216,184,0.7);}
  .mobile-menu a:hover{color:var(--accent);}
  .mobile-menu .mobile-lang{margin-top:16px;align-self:flex-start;}

  .btn{
    cursor:pointer;font-family:var(--body);border:none;
    border-radius:999px;display:inline-flex;align-items:center;justify-content:center;
  }
  .btn-lang{
    background:transparent;border:1px solid #D8C29B;color:#4A3320;
    padding:8px 14px;font-size:13px;font-weight:600;letter-spacing:0.02em;gap:6px;
    transition:border-color .18s ease,color .18s ease;
  }
  .btn-lang:hover{border-color:var(--accent);color:var(--accent);}
  .btn-primary{
    background:var(--accent);color:#FFF9EF;
    padding:11px 20px;font-size:14.5px;font-weight:700;
    box-shadow:0 6px 18px rgba(160,70,20,0.28);
    transition:transform .18s ease,box-shadow .18s ease;
  }
  .btn-primary:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(160,70,20,0.34);}

  /* ── Hero ───────────────────────────────────────────── */
  .hero{
    position:relative;min-height:88vh;min-height:640px;
    display:flex;align-items:flex-end;overflow:hidden;background:#3A2517;
  }
  .hero-bg{position:absolute;inset:0;}
  .hero-bg img{width:100%;height:100%;object-fit:cover;}
  .hero-scrim{
    position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(175deg,rgba(35,20,12,0.28) 0%,rgba(35,20,12,0.05) 38%,rgba(35,20,12,0.55) 74%,rgba(35,20,12,0.82) 100%);
  }
  .hero-inner{position:relative;width:100%;max-width:1200px;margin:0 auto;padding:120px 28px 68px;}
  .hero-content{max-width:660px;color:#FFF9EF;}
  .eyebrow-pill{
    display:inline-flex;align-items:center;gap:8px;
    background:rgba(255,249,239,0.14);border:1px solid rgba(255,249,239,0.32);
    backdrop-filter:blur(4px);padding:7px 15px;border-radius:999px;
    font-size:13px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;
    animation:riseIn .6s both;
  }
  .eyebrow-dot{width:7px;height:7px;border-radius:50%;background:var(--amber);flex:none;}
  .hero h1{
    font-weight:700;font-size:clamp(42px,7vw,86px);line-height:0.98;letter-spacing:-0.02em;
    margin:22px 0 0;text-wrap:balance;text-shadow:0 2px 30px rgba(20,10,4,0.4);
    animation:riseIn .7s both;animation-delay:.08s;
  }
  .hero-lead{
    font-size:clamp(16px,1.7vw,19px);line-height:1.6;max-width:560px;margin:22px 0 0;color:#F4E7D3;
    animation:riseIn .7s both;animation-delay:.16s;
  }
  .hero-actions{display:flex;flex-wrap:wrap;gap:14px;margin-top:30px;animation:riseIn .7s both;animation-delay:.24s;}
  .btn-hero{
    background:var(--accent);color:#FFF9EF;padding:16px 30px;font-size:17px;font-weight:700;
    box-shadow:0 10px 30px rgba(120,50,12,0.45);transition:transform .18s ease,box-shadow .18s ease;
  }
  .btn-hero:hover{transform:translateY(-2px);box-shadow:0 14px 36px rgba(120,50,12,0.55);}
  .btn-ghost{
    display:inline-flex;align-items:center;gap:9px;
    background:rgba(255,249,239,0.12);border:1px solid rgba(255,249,239,0.4);color:#FFF9EF;
    padding:16px 26px;border-radius:999px;font-size:16px;font-weight:600;
    backdrop-filter:blur(4px);transition:background .18s ease;
  }
  .btn-ghost:hover{background:rgba(255,249,239,0.22);color:#FFF9EF;}
  .hero-chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px;animation:riseIn .7s both;animation-delay:.32s;}
  .chip{
    display:inline-flex;align-items:center;gap:7px;font-size:13.5px;font-weight:500;color:#F4E7D3;
    background:rgba(255,249,239,0.1);padding:7px 14px;border-radius:999px;
  }

  /* ── Stats band ─────────────────────────────────────── */
  .stats{background:var(--dark);color:var(--dark-text);}
  .stats-head{max-width:1200px;margin:0 auto;padding:40px 28px 0;}
  .stats-eyebrow{color:var(--amber);}
  .stats-grid{
    max-width:1200px;margin:0 auto;padding:24px 28px 40px;
    display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:22px;
  }
  .stat{display:flex;flex-direction:column;gap:6px;padding:8px 0 8px 18px;border-left:2px solid rgba(240,169,75,0.4);}
  .stat-num{font-family:var(--display);font-weight:700;font-size:clamp(30px,3.6vw,44px);line-height:1;color:var(--amber);}
  .stat-label{font-size:14px;color:#D8C09E;line-height:1.35;}

  /* ── Section headings ───────────────────────────────── */
  .section-pad{padding:clamp(64px,9vw,104px) 0;}
  .head{max-width:680px;}
  .eyebrow{font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:0.14em;text-transform:uppercase;color:var(--accent);}
  .head h2{font-weight:700;font-size:clamp(30px,4.4vw,54px);line-height:1.02;letter-spacing:-0.02em;margin:14px 0 0;text-wrap:balance;}
  .head p{font-size:18px;line-height:1.62;color:#5C4630;margin:18px 0 0;}

  /* ── Experience ─────────────────────────────────────── */
  .experience{background:var(--cream);}
  .feature-img{
    margin-top:40px;border-radius:24px;overflow:hidden;
    height:clamp(260px,34vw,420px);background:#E7D5B4;box-shadow:0 20px 50px rgba(90,55,20,0.16);
  }
  .feature-img img{width:100%;height:100%;object-fit:cover;}
  .cards{margin-top:36px;display:grid;grid-template-columns:repeat(auto-fit,minmax(238px,1fr));gap:22px;}
  .cards-head{margin-top:44px;}
  .cards-head + .cards{margin-top:18px;}
  .cards-cta{margin-top:34px;text-align:center;}
  .card{
    background:var(--cream-card);border:1px solid #EBD9BB;border-radius:20px;padding:30px 26px;
    display:flex;flex-direction:column;gap:12px;transition:transform .2s ease,box-shadow .2s ease;
  }
  .card:hover{transform:translateY(-5px);box-shadow:0 16px 34px rgba(120,70,20,0.14);}
  .card-n{font-family:var(--display);font-weight:700;font-size:15px;color:var(--accent);letter-spacing:0.08em;}
  .card h3{font-weight:700;font-size:22px;line-height:1.12;margin:0;}
  .card p{font-size:15px;line-height:1.6;color:#6B543C;margin:0;}

  /* ── Tasting (dark) ─────────────────────────────────── */
  .tasting{background:#5C3620;color:var(--dark-text);position:relative;overflow:hidden;}
  .tasting-glow{
    position:absolute;top:-80px;right:-60px;width:300px;height:300px;border-radius:50%;
    background:radial-gradient(circle,rgba(240,169,75,0.16),transparent 70%);pointer-events:none;
  }
  .tasting .wrap{position:relative;}
  .tasting .eyebrow{color:var(--amber);}
  .tasting .head h2{color:#FFF9EF;}
  .tasting .head p{color:#D8C09E;}
  .split{margin-top:44px;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:38px;align-items:center;}
  .split-img{border-radius:22px;overflow:hidden;height:clamp(260px,26vw,360px);background:#3A2517;}
  .split-img img{width:100%;height:100%;object-fit:cover;}
  .split h3{font-weight:700;font-size:clamp(24px,2.6vw,32px);line-height:1.08;margin:0;color:#FFF9EF;}
  .split p{font-size:16.5px;line-height:1.65;color:#D8C09E;margin:16px 0 0;}
  .split .media-right{order:2;}
  .split .text-left{order:1;}
  .venues{margin-top:44px;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;}
  .venue{background:rgba(255,249,239,0.06);border:1px solid rgba(255,249,239,0.12);border-radius:18px;padding:26px;}
  .venue h4{font-weight:700;font-size:19px;margin:0;color:var(--amber);}
  .venue p{font-size:15px;line-height:1.55;color:#D8C09E;margin:10px 0 0;}

  /* ── Reviews ────────────────────────────────────────── */
  .reviews{background:var(--cream);}
  .reviews-inner{max-width:760px;margin:0 auto;text-align:center;}
  .reviews-tagline{font-family:var(--display);font-weight:700;font-size:clamp(22px,3vw,32px);line-height:1.2;color:var(--ink);margin:10px 0 0;text-wrap:balance;}
  .review-cards{margin:36px auto 0;display:flex;flex-wrap:wrap;justify-content:center;gap:24px;}
  .review-card{background:var(--cream-card);border:1px solid #EBD9BB;border-radius:18px;padding:24px 32px;min-width:180px;}
  .review-stars{color:var(--amber);font-size:20px;letter-spacing:3px;}
  .review-score{font-family:var(--display);font-weight:700;font-size:26px;color:var(--ink);margin-top:6px;}
  .review-platform{font-size:13px;letter-spacing:0.06em;text-transform:uppercase;color:#8A6A4C;margin-top:4px;font-weight:600;}

  /* ── Visit ──────────────────────────────────────────── */
  .visit{background:var(--cream-card);}
  .visit-grid{margin-top:40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:26px;align-items:stretch;}
  .info-col{display:flex;flex-direction:column;gap:18px;}
  .info-card{background:var(--cream);border:1px solid #EBD9BB;border-radius:18px;padding:24px 26px;}
  .info-label{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:0.1em;text-transform:uppercase;color:var(--green);}
  .info-strong{font-size:19px;font-weight:600;margin-top:8px;}
  .info-time{font-size:22px;font-weight:700;font-family:var(--display);color:var(--ink);margin-top:2px;}
  .info-note{font-size:14px;color:#8A6A4C;margin-top:6px;line-height:1.5;}
  .price-list{display:flex;flex-direction:column;gap:5px;margin-top:10px;font-size:16px;}
  .price-list .muted{font-size:14px;color:#8A6A4C;}
  .map-img{border-radius:20px;overflow:hidden;min-height:360px;background:#E7D5B4;border:1px solid #EBD9BB;}
  .map-img img{width:100%;height:100%;object-fit:cover;}
  .visit-cta{margin-top:30px;text-align:center;}
  .btn-book-lg{
    background:var(--accent);color:#FFF9EF;padding:16px 34px;font-size:17px;font-weight:700;
    box-shadow:0 10px 28px rgba(160,70,20,0.28);transition:transform .18s ease;
  }
  .btn-book-lg:hover{transform:translateY(-2px);}

  /* ── CTA band ───────────────────────────────────────── */
  .cta{background:var(--accent);color:#FFF9EF;padding:clamp(56px,8vw,90px) 0;text-align:center;}
  .cta-inner{max-width:760px;margin:0 auto;padding:0 28px;}
  .cta h2{font-weight:700;font-size:clamp(30px,4.6vw,52px);line-height:1.02;letter-spacing:-0.02em;margin:0;text-wrap:balance;}
  .cta p{font-size:18px;line-height:1.55;color:#FCEBD6;margin:16px 0 30px;}
  .btn-cta{
    background:#FFF9EF;color:var(--accent-dark);padding:17px 38px;font-size:18px;font-weight:700;
    box-shadow:0 12px 30px rgba(60,25,8,0.28);transition:transform .18s ease,box-shadow .18s ease;
  }
  .btn-cta:hover{transform:translateY(-3px);box-shadow:0 16px 38px rgba(60,25,8,0.36);}

  /* ── Footer ─────────────────────────────────────────── */
  .site-footer{background:var(--dark);color:#C9B79A;padding:52px 0 44px;}
  .footer-top{
    max-width:1200px;margin:0 auto;padding:0 28px;
    display:flex;flex-wrap:wrap;gap:28px;justify-content:space-between;align-items:flex-start;
  }
  .footer-brand{max-width:340px;}
  .footer-brand-row{display:flex;align-items:center;gap:12px;}
  .footer-mark{
    width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:var(--accent);color:#FFF9EF;font-family:var(--display);font-weight:800;font-size:19px;flex:none;
  }
  .footer-brand-row strong{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:0.06em;color:#FFF9EF;}
  .footer-tagline{font-size:14.5px;line-height:1.55;margin:16px 0 0;}
  .footer-contact{display:flex;gap:48px;flex-wrap:wrap;}
  .footer-contact-col{display:flex;flex-direction:column;gap:9px;font-size:14.5px;}
  .footer-address{color:var(--amber);font-weight:600;}
  .footer-rights{
    max-width:1200px;margin:32px auto 0;padding:20px 28px 0;
    border-top:1px solid rgba(255,249,239,0.1);font-size:13px;color:#8A7358;
  }

  @media (max-width:860px){
    .nav-links{display:none;}
    .nav > .btn-lang{display:none;}
    .nav-toggle{display:flex;}
    .site-header.menu-open .mobile-menu{display:flex;}
    .nav{gap:12px;padding:12px 18px;}
    .btn-primary{padding:9px 15px;font-size:13.5px;}
    .brand-tag{display:none;}
    .hero-inner{padding:104px 22px 56px;}
  }
  @media (max-width:480px){
    .brand-logo .wl-2{font-size:24px;}
    .brand-logo .wl-1{font-size:11px;}
    .hero-inner{padding:94px 20px 46px;}
    .hero h1{font-size:clamp(34px,10vw,50px);}
    .modal{padding:28px 22px 24px;}
    .btn-hero,.btn-ghost{width:100%;}
  }

  /* ── Booking modal ──────────────────────────────────── */
  .modal-backdrop{
    position:fixed;inset:0;z-index:100;
    display:flex;align-items:center;justify-content:center;padding:24px;
    background:rgba(20,10,4,0.55);backdrop-filter:blur(6px);
    opacity:0;visibility:hidden;transition:opacity .22s ease,visibility .22s ease;
  }
  .modal-backdrop.open{opacity:1;visibility:visible;}
  .modal{
    position:relative;width:100%;max-width:480px;max-height:calc(100vh - 48px);overflow-y:auto;
    background:var(--cream);border-radius:24px;padding:34px 32px 32px;
    box-shadow:0 30px 80px rgba(20,10,4,0.5);
    transform:translateY(16px) scale(.98);transition:transform .22s ease;
  }
  .modal-backdrop.open .modal{transform:none;}
  .modal-close{
    position:absolute;top:16px;right:16px;width:34px;height:34px;border-radius:50%;
    border:none;cursor:pointer;background:rgba(43,26,16,0.08);color:#4A3320;
    font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center;
    transition:background .15s ease;
  }
  .modal-close:hover{background:rgba(43,26,16,0.16);}
  .modal-title{font-weight:700;font-size:26px;line-height:1.1;margin:0;letter-spacing:-0.01em;color:var(--ink);}
  .modal-sub{font-size:14.5px;line-height:1.5;color:#6B543C;margin:10px 0 22px;}
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
  .field > span{font-family:var(--display);font-weight:700;font-size:12.5px;letter-spacing:0.06em;text-transform:uppercase;color:#4A3320;}
  .field input{
    font-family:var(--body);font-size:15px;color:var(--ink);
    padding:11px 14px;border:1px solid #D8C29B;border-radius:12px;background:var(--cream-card);
    transition:border-color .15s ease,box-shadow .15s ease;
  }
  .field input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(181,89,28,0.14);}
  .field input:invalid:not(:placeholder-shown){border-color:#B4432B;}
  .qty-list{display:flex;flex-direction:column;gap:10px;margin:20px 0 6px;}
  .qty-row{
    display:flex;align-items:center;gap:12px;
    background:var(--cream-card);border:1px solid #EBD9BB;border-radius:14px;padding:12px 14px;
  }
  .qty-info{flex:1;display:flex;flex-direction:column;gap:1px;}
  .qty-name{font-weight:600;font-size:15px;color:var(--ink);}
  .qty-price{font-size:13px;color:#8A6A4C;}
  .stepper{display:flex;align-items:center;gap:10px;}
  .step{
    width:30px;height:30px;border-radius:50%;border:1px solid #D8C29B;background:var(--cream);
    color:var(--accent);font-size:18px;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:border-color .15s ease,color .15s ease;
  }
  .step:hover:not(:disabled){border-color:var(--accent);}
  .step:disabled{opacity:.4;cursor:not-allowed;}
  .step-val{min-width:20px;text-align:center;font-family:var(--display);font-weight:700;font-size:17px;color:var(--ink);}
  .total-row{
    display:flex;align-items:baseline;justify-content:space-between;

      fangourinText: "Prolongez votre découverte des saveurs mauriciennes avec une cuisine locale revisitée, généreuse et élégante, élaborée à partir de produits du terroir. Cocktails signature aux rhums New Grove, desserts inspirés des célèbres sucres de canne non raffinés et cadre verdoyant au cœur du domaine de Beau Plan.",

      venuesBook: "Réservez vos billets",

      locLabel: "Comment venir", locValue: "Beau Plan, Pamplemousses", locNote: "15 min de Port-Louis et Grand Baie · Près du Jardin botanique de Pamplemousses. Parking gratuit",
      visitBook: "Réserver en ligne",
      reviewsEyebrow: "Pourquoi les visiteurs adorent",
      reviewsTagline: "L'une des attractions incontournables de Maurice",
      reviewsTripScore: "4,4 / 5", reviewsTripLabel: "TripAdvisor",
      reviewsGoogleScore: "4,5 / 5", reviewsGoogleLabel: "Google",
      ctaTitle: "Prêt·e à goûter à cette aventure ?",
      ctaText: "Réservez en ligne en quelques clics pour savourer l'expérience.",
      ctaBook: "Réservez vos billets",
      footerTagline: "L'histoire du sucre, du rhum et de Maurice — sous un même toit.",
      footerAddress: "Beau Plan, Pamplemousses, Île Maurice",
      footerRights: "© 2026 L'Aventure du Sucre. Tous droits réservés.",
      pageTitle: "L'Aventure du Sucre — La plus douce aventure de l'île Maurice",
      metaDesc: "Entrez dans une sucrerie vieille de 260 ans à Beau Plan, Maurice. Dégustez des rhums rares, découvrez des sucres extraordinaires et réservez votre sortie en famille.",
      bookModalTitle: "Réservez votre visite",
      bookModalSubtitle: "Réservez vos billets pour L'Aventure du Sucre — nous vous enverrons votre confirmation par e-mail.",
      formName: "Nom complet", formEmail: "E-mail", formDate: "Date de visite",
      formAdults: "Adultes", formChildren: "Enfants (6–12 ans)", formUnder6: "Moins de 6 ans", formUnder6Note: "Gratuit",
      formTotal: "Total", formSubmit: "Confirmer la réservation",
      formFineprint: "Formulaire de démonstration — aucun paiement n'est prélevé et aucun billet n'est émis.",
      formSuccessTitle: "Réservation reçue !",
      formSuccessText: "Merci, {name}. Une confirmation pour {count} le {date} est en route vers {email}.",
      formTicketOne: "1 billet", formTicketMany: "{n} billets",
      formAgain: "Réserver une autre visite",
      formNeedTickets: "Veuillez ajouter au moins un billet.",
    },
  };

  // Language is driven by the URL path: "/" = English, "/fr" = French.
  function langFromPath() {
    return /^\/fr(\/|$)/i.test(location.pathname) ? "fr" : "en";
  }

  let lang = langFromPath();

  function render() {
    const t = STRINGS[lang];
    document.documentElement.lang = lang;
    document.title = t.pageTitle;
    const metaDesc = document.querySelector('meta[name="description"]');
    if (metaDesc) metaDesc.setAttribute("content", t.metaDesc);
    const canonical = document.querySelector('link[rel="canonical"]');
    if (canonical) canonical.setAttribute("href", lang === "fr" ? "/fr" : "/");

    document.querySelectorAll("[data-i18n]").forEach((el) => {
      const key = el.getAttribute("data-i18n");
      if (t[key] != null) el.textContent = t[key];
    });

    // Stats band
    const statsGrid = document.getElementById("stats-grid");
    statsGrid.innerHTML = "";
    t.stats.forEach((s) => {
      const wrap = document.createElement("div");
      wrap.className = "stat";
      const num = document.createElement("span");
      num.className = "stat-num";
      num.textContent = s.num;
      const label = document.createElement("span");
      label.className = "stat-label";
      label.textContent = s.label;
      wrap.append(num, label);
      statsGrid.appendChild(wrap);
    });

    // Experience cards
    const cardsGrid = document.getElementById("cards-grid");
    cardsGrid.innerHTML = "";
    t.cards.forEach((c) => {
      const card = document.createElement("div");
      card.className = "card";
      const n = document.createElement("span");
      n.className = "card-n";
      n.textContent = c.n;
      const h3 = document.createElement("h3");
      h3.textContent = c.title;
      const p = document.createElement("p");
      p.textContent = c.body;
      card.append(n, h3, p);
      cardsGrid.appendChild(card);
    });

    // Footer hours line
    document.getElementById("footer-hours").textContent = t.hoursValue + " · " + t.hoursTime;
  }

  function setLang(next, push) {
    lang = next;
    if (push) {
      try { history.pushState({ lang: next }, "", next === "fr" ? "/fr" : "/"); } catch (e) {}
    }
    render();
  }
  function toggleLang() { setLang(lang === "en" ? "fr" : "en", true); }
  window.addEventListener("popstate", () => setLang(langFromPath(), false));

  /* ── Mobile menu ───────────────────────────────────── */
  const header = document.querySelector(".site-header");
  const navToggle = header.querySelector(".nav-toggle");
  function closeMenu() {
    header.classList.remove("menu-open");
    if (navToggle) navToggle.setAttribute("aria-expanded", "false");
  }
  function toggleMenu() {
    const open = header.classList.toggle("menu-open");
    if (navToggle) navToggle.setAttribute("aria-expanded", open ? "true" : "false");
  }
  window.addEventListener("resize", () => { if (window.innerWidth > 860) closeMenu(); });

  /* ── Booking modal ─────────────────────────────────── */
  const PRICES = { adults: 425, children: 215, under6: 0 };
  const MAX_PER_TYPE = 20;
  const counts = { adults: 2, children: 0, under6: 0 };

  const modal = document.getElementById("book-modal");
  const formView = document.getElementById("modal-form-view");
  const successView = document.getElementById("modal-success-view");
  const bookForm = document.getElementById("book-form");
  let lastFocused = null;

  function groupNum(n, sep) {
    return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, sep);
  }
  function fmtMoney(n) {
    return "Rs " + groupNum(n, lang === "fr" ? " " : ",");
  }

  function updateTotal() {
    const total = counts.adults * PRICES.adults + counts.children * PRICES.children;
    document.getElementById("total-amount").textContent = fmtMoney(total);
    modal.querySelectorAll(".stepper").forEach((st) => {
      const field = st.getAttribute("data-field");
      const min = parseInt(st.getAttribute("data-min"), 10) || 0;
      st.querySelector(".step-val").textContent = counts[field];
      const dec = st.querySelector('[data-dir="-1"]');
      const inc = st.querySelector('[data-dir="1"]');
      if (dec) dec.disabled = counts[field] <= min;
      if (inc) inc.disabled = counts[field] >= MAX_PER_TYPE;
    });
  }

  function openModal() {
    closeMenu();
    lastFocused = document.activeElement;
    successView.hidden = true;
    formView.hidden = false;
    modal.classList.add("open");
    modal.setAttribute("aria-hidden", "false");
    document.body.classList.add("modal-open");
    bookForm.elements.date.min = new Date().toISOString().slice(0, 10);
    updateTotal();
    setTimeout(() => bookForm.elements.name.focus(), 60);
  }

  function closeModal() {
    modal.classList.remove("open");
    modal.setAttribute("aria-hidden", "true");
    document.body.classList.remove("modal-open");
    if (lastFocused && lastFocused.focus) lastFocused.focus();
  }

  function resetModal() {
    bookForm.reset();
    counts.adults = 2; counts.children = 0; counts.under6 = 0;
    successView.hidden = true;
    formView.hidden = false;
    updateTotal();
    bookForm.elements.name.focus();
  }

  // Steppers + backdrop click (backdrop element === modal itself).
  modal.addEventListener("click", (e) => {
    if (e.target === modal) { closeModal(); return; }
    const step = e.target.closest(".step");
    if (!step) return;
    const st = step.closest(".stepper");
    const field = st.getAttribute("data-field");
    const min = parseInt(st.getAttribute("data-min"), 10) || 0;
    const dir = parseInt(step.getAttribute("data-dir"), 10);
    counts[field] = Math.max(min, Math.min(MAX_PER_TYPE, counts[field] + dir));
    updateTotal();
  });

  bookForm.addEventListener("submit", (e) => {
    e.preventDefault();
    const t = STRINGS[lang];
    const totalTickets = counts.adults + counts.children + counts.under6;
    if (totalTickets < 1) { alert(t.formNeedTickets); return; }
    if (!bookForm.checkValidity()) { bookForm.reportValidity(); return; }

    const data = new FormData(bookForm);
    const name = (data.get("name") || "").toString().trim();
    const email = (data.get("email") || "").toString().trim();
    const dateVal = (data.get("date") || "").toString();
    let dateFmt = dateVal;
    try {
      dateFmt = new Date(dateVal + "T00:00:00").toLocaleDateString(
        lang === "fr" ? "fr-FR" : "en-GB",
        { day: "numeric", month: "long", year: "numeric" }
      );
    } catch (err) { /* fall back to raw value */ }
    const countLabel = totalTickets === 1
      ? t.formTicketOne
      : t.formTicketMany.replace("{n}", totalTickets);

    document.getElementById("success-text").textContent = t.formSuccessText
      .replace("{name}", name)
      .replace("{count}", countLabel)
      .replace("{date}", dateFmt)
      .replace("{email}", email);

    formView.hidden = true;
    successView.hidden = false;
    successView.querySelector("button").focus();
  });

  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    if (modal.classList.contains("open")) closeModal();
    else if (header.classList.contains("menu-open")) closeMenu();
  });

  document.addEventListener("click", (e) => {
    const target = e.target.closest("[data-action]");
    if (!target) return;
    const action = target.getAttribute("data-action");
    if (action === "toggle-lang") toggleLang();
    if (action === "toggle-menu") toggleMenu();
    if (action === "close-menu") closeMenu();
    if (action === "book") { e.preventDefault(); openModal(); }
    if (action === "close-modal") closeModal();
    if (action === "reset-modal") resetModal();
  });

  render();
  updateTotal();
</script>
</body>
</html>
